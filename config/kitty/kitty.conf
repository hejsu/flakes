## kitty color_scheme
# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

## kitty login shell
## shell $HOME/.local/state/nix/profile/bin/fish -l -i
shell /run/current-system/sw/bin/fish -l -i
## -------------------


## Font config
font_family      family='FiraCode Nerd Font Mono' style=Light
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 14

modify_font cell_height 110%

symbol_map U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6AA,U+E700-U+E7C5,U+EA60-U+EBEB,U+F000-U+F2E0,U+F300-U+F32F,U+F400-U+F4A9,U+F500-U+F8FF,U+F0001-U+F1AF0 Symbols Nerd Font Mono
## -------------------

## UI
# Title Bar and Tab Bar style
macos_titlebar_color background

# Tab bar style
tab_bar_style               custom
tab_separator               ""
tab_fade                    0 0 0 0

tab_title_template          "{fmt.fg._a6adc8}{fmt.bg.default}  {index}:{title}{' [󰹑]' if layout_name == 'stack' else ''} "
active_tab_title_template   "{fmt.fg._fab387}{fmt.bg.default}  {index}:{title}{' [󰹑]' if layout_name == 'stack' else ''} "

tab_bar_background          none
tab_bar_margin_color        none
active_tab_background       #1e1e2e
active_tab_foreground       #fab387
inactive_tab_background     #1e1e2e
inactive_tab_foreground     #a6adc8

tab_bar_edge                bottom
tab_bar_align               left
tab_bar_margin_width        15.0
tab_bar_margin_height       2.0 0.0
active_tab_font_style       normal
inactive_tab_font_style     normal
tab_bar_min_tabs            1
tab_activity_symbol         none
bell_on_tab                 no

# Windows align
window_border_width        1pt
window_margin_width        5
window_padding_width       2
single_window_margin_width 0

# border color
# active_border_color #d0d1fa
## -------------------


## settings
confirm_os_window_close 0
macos_option_as_alt yes
## -------------------


## Keybind or keymap
# jump to beginning and end of line:
map cmd+right send_text all \x05
map cmd+left send_text all \x01
# delete line / word:
map cmd+backspace send_text all \x15
map alt+backspace send_text all \x17
## -------------------


## ssh
shell_integration enabled no-cursor


