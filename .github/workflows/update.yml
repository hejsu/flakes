name: Prepare configuration

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0' # Sunday 11:00 Asia/Shanghai; GitHub schedules use UTC.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Update dependencies, or check the current lock without upgrading'
        type: choice
        options: [update, check]
        default: update
      inputs:
        description: 'Inputs to update, space-separated; empty updates all (e.g. llm-agents)'
        type: string
        required: false
        default: ''
      refresh-caddy:
        description: 'Force Caddy hash refresh (e.g. repair an already stale hash)'
        type: boolean
        default: false

permissions:
  contents: read
  checks: read

concurrency:
  group: flake-input-update
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      pr: ${{ steps.pr.outputs.pull-request-number }}
      check_only: ${{ env.CHECK_ONLY }}

    env:
      CHECK_ONLY: ${{ github.event_name == 'push' || inputs.mode == 'check' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check update token
        env:
          TOKEN: ${{ secrets.FLAKE_UPDATE_TOKEN }}
        run: ': "${TOKEN:?Set the FLAKE_UPDATE_TOKEN repository secret}"'

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Prepare dependencies without changing main
        env:
          REQUESTED_INPUTS: ${{ inputs.inputs }}
          FORCE_CADDY: ${{ inputs['refresh-caddy'] || false }}
          PUSH_BASE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: python3 .github/scripts/update-inputs.py

      - name: Prepare PR description and package diff
        env:
          BASE_COMMIT: ${{ steps.checkout.outputs.commit }}
          OUTPUT: ${{ runner.temp }}/update-pr.md
        run: python3 .github/scripts/update-report.py

      - name: Create or update pull request
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.FLAKE_UPDATE_TOKEN }}
          base: main
          branch: automation/${{ env.CHECK_ONLY == 'true' && 'caddy-hash' || 'flake-update' }}
          delete-branch: true
          add-paths: |
            flake.lock
            hosts/hws/default.nix
          commit-message: 'chore: refresh Caddy dependency hash'
          title: 'chore: update dependency state'
          body-path: ${{ runner.temp }}/update-pr.md

  build:
    name: Build prepared configuration
    needs: prepare
    if: needs.prepare.outputs.check_only == 'true' && needs.prepare.outputs.pr == ''
    uses: ./.github/workflows/build.yml
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
