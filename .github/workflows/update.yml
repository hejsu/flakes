name: Prepare configuration

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0' # Sunday 11:00 Asia/Shanghai; GitHub schedules use UTC.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Update dependencies, or check the current lock without upgrading'
        type: choice
        options: [update, check]
        default: update
      inputs:
        description: 'Inputs to update, space-separated; empty updates all (e.g. llm-agents)'
        type: string
        required: false
        default: ''
      refresh-caddy:
        description: 'Force Caddy hash refresh (e.g. repair an already stale hash)'
        type: boolean
        default: false

concurrency:
  group: flake-input-update
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr: ${{ steps.pr.outputs.pull-request-number }}
      branch: automation/${{ env.CHECK_ONLY == 'true' && 'caddy-hash' || 'flake-update' }}
      base: ${{ steps.checkout.outputs.commit }}
      check_only: ${{ env.CHECK_ONLY }}

    env:
      CHECK_ONLY: ${{ github.event_name == 'push' || inputs.mode == 'check' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Prepare dependencies without changing main
        env:
          REQUESTED_INPUTS: ${{ inputs.inputs }}
          FORCE_CADDY: ${{ inputs['refresh-caddy'] || false }}
          PUSH_BASE: ${{ github.event.before }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: python3 .github/scripts/update-inputs.py

      # A no-op check must not let create-pull-request close an existing repair PR.
      - name: Detect a Caddy repair
        id: caddy
        if: env.CHECK_ONLY == 'true'
        run: |
          changed=$(git diff --name-only HEAD -- modules/services/caddy.nix)
          if [ -n "$changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare PR description
        if: env.CHECK_ONLY != 'true' || steps.caddy.outputs.changed == 'true'
        env:
          BASE_COMMIT: ${{ steps.checkout.outputs.commit }}
          OUTPUT: ${{ runner.temp }}/update-pr.md
        run: python3 .github/scripts/update-report.py render

      - name: Create or update pull request
        id: pr
        if: env.CHECK_ONLY != 'true' || steps.caddy.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: main
          branch: automation/${{ env.CHECK_ONLY == 'true' && 'caddy-hash' || 'flake-update' }}
          delete-branch: true
          add-paths: |
            flake.lock
            modules/services/caddy.nix
          commit-message: 'chore: refresh Caddy dependency hash'
          title: 'chore: update dependency state'
          body-path: ${{ runner.temp }}/update-pr.md
          reviewers: ${{ github.repository_owner }}

  build:
    name: Build prepared configuration
    needs: prepare
    if: needs.prepare.outputs.pr != '' || needs.prepare.outputs.check_only == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.pr != '' && format('refs/heads/{0}', needs.prepare.outputs.branch) || '' }}
      diff-base: ${{ needs.prepare.outputs.pr != '' && needs.prepare.outputs.base || '' }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  report:
    name: Update PR closure diff
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.pr != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: closure-diff-*
          path: ${{ runner.temp }}/closure-diff
          merge-multiple: true

      - name: Update pull request description
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr }}
          DIFF_DIR: ${{ runner.temp }}/closure-diff
        run: python3 .github/scripts/update-report.py update
