name: Update flake inputs

on:
  schedule:
    - cron: '0 3 * * 0' # Sunday 11:00 Asia/Shanghai; GitHub schedules use UTC.
  workflow_dispatch:
    inputs:
      inputs:
        description: 'Inputs to update, space-separated; empty updates all (e.g. llm-agents)'
        type: string
        required: false
        default: ''
      refresh-caddy:
        description: 'Force Caddy hash refresh (e.g. repair an already stale hash)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: flake-input-update
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: main
          persist-credentials: false

      - name: Check update token
        env:
          TOKEN: ${{ secrets.FLAKE_UPDATE_TOKEN }}
        run: ': "${TOKEN:?Set the FLAKE_UPDATE_TOKEN repository secret}"'

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Update dependencies
        env:
          REQUESTED_INPUTS: ${{ inputs.inputs }}
          FORCE_CADDY: ${{ inputs['refresh-caddy'] || false }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: python3 .github/scripts/update-inputs.py

      - name: Prepare PR description
        env:
          BASE_COMMIT: ${{ steps.checkout.outputs.commit }}
        run: |
          {
            git log --format=%b "$BASE_COMMIT..HEAD"
            echo '```diff'
            git diff -- hosts/hws/default.nix
            echo '```'
            echo '<!-- update-report:start -->'
            echo '<!-- update-report:end -->'
          } > "$RUNNER_TEMP/update-pr.md"

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.FLAKE_UPDATE_TOKEN }}
          base: main
          branch: automation/flake-update
          delete-branch: true
          add-paths: |
            flake.lock
            hosts/hws/default.nix
          commit-message: 'chore: refresh Caddy dependency hash'
          title: 'chore: update flake inputs'
          body-path: ${{ runner.temp }}/update-pr.md
